apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: oms
  labels: { app: auth-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/jagadeesh-udatha/oms-auth-service:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: oms-config }
            - secretRef: { name: oms-secrets }
          env:
            - name: PORT
              value: "8080"
            - name: DB_URL
              value: jdbc:mysql://mysql.oms-infra:3306/oms_auth
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: oms
spec:
  selector: { app: auth-service }
  ports: [{ port: 80, targetPort: 8080 }]
