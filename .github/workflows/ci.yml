name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  images:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [auth-service, catalog-service, order-service, payment-service, notification-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg MODULE=${{ matrix.module }} -t oms-${{ matrix.module }}:${{ github.sha }} .
