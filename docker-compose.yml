# Whole system on one machine:  docker compose up --build
# Gateway on http://localhost:8080. Each service gets its own database (one MySQL server, four schemas).
x-service: &service
  restart: unless-stopped
  environment: &env
    JWT_SECRET: local-dev-secret-change-me-0123456789abcdef
    KAFKA_BOOTSTRAP: kafka:9092
    DB_USER: oms
    DB_PASSWORD: oms
  depends_on:
    mysql: { condition: service_healthy }
    kafka: { condition: service_started }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./dev/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3

  auth-service:
    <<: *service
    build: { context: ., args: { MODULE: auth-service } }
    environment:
      <<: *env
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/oms_auth

  catalog-service:
    <<: *service
    build: { context: ., args: { MODULE: catalog-service } }
    environment:
      <<: *env
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/oms_catalog

  order-service:
    <<: *service
    build: { context: ., args: { MODULE: order-service } }
    environment:
      <<: *env
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/oms_orders
      CATALOG_URL: http://catalog-service:8080

  payment-service:
    <<: *service
    build: { context: ., args: { MODULE: payment-service } }
    environment:
      <<: *env
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/oms_payments

  notification-service:
    <<: *service
    build: { context: ., args: { MODULE: notification-service } }
    environment:
      <<: *env
      PORT: 8080
      MONGO_URI: mongodb://mongo:27017/oms_notifications
    depends_on: [mongo, kafka]

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      JWT_SECRET: local-dev-secret-change-me-0123456789abcdef
      AUTH_URL: http://auth-service:8080
      CATALOG_URL: http://catalog-service:8080
      ORDER_URL: http://order-service:8080
      PAYMENT_URL: http://payment-service:8080
      NOTIFICATION_URL: http://notification-service:8080
