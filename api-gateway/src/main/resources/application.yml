server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      routes:
        - id: auth
          uri: ${AUTH_URL:http://localhost:8081}
          predicates: [ "Path=/api/auth/**" ]
        - id: catalog
          uri: ${CATALOG_URL:http://localhost:8082}
          predicates: [ "Path=/api/products/**" ]
        - id: orders
          uri: ${ORDER_URL:http://localhost:8083}
          predicates: [ "Path=/api/orders/**" ]
        - id: payments
          uri: ${PAYMENT_URL:http://localhost:8084}
          predicates: [ "Path=/api/payments/**" ]
        - id: notifications
          uri: ${NOTIFICATION_URL:http://localhost:8085}
          predicates: [ "Path=/api/notifications/**" ]
oms:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
